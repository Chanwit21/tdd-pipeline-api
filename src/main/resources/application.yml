spring:
  application:
    name: tdd-pipeline
  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/tddpipeline}
    username: ${SPRING_DATASOURCE_USERNAME:tdd}
    password: ${SPRING_DATASOURCE_PASSWORD:tdd_secret}
  jpa:
    hibernate:
      ddl-auto: none
    open-in-view: false
    properties:
      hibernate:
        jdbc:
          time_zone: UTC
  flyway:
    enabled: true
    baseline-on-migrate: true

server:
  port: 8080
  error:
    include-message: always

app:
  jwt:
    secret: ${JWT_SECRET:change-me-to-a-long-random-string-at-least-32-bytes-long}
    expiration-ms: ${JWT_EXPIRATION_MS:28800000}
  cors:
    origins: ${APP_CORS_ORIGINS:http://localhost:3000}

logging:
  level:
    org.hibernate.SQL: warn
